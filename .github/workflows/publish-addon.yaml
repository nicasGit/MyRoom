name: Build and publish HAOS add-on

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-addon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read add-on version
        id: addon
        shell: python
        run: |
          import os, re
          from pathlib import Path
          config = Path('haos-addon/config.yaml').read_text()
          version = re.search(r'^version: "([0-9]+\.[0-9]+\.[0-9]+)"$', config, re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: haos-addon/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/nicasgit/myroom:${{ steps.addon.outputs.version }}
            ghcr.io/nicasgit/myroom:latest
          labels: |
            org.opencontainers.image.source=https://github.com/nicasgit/myroom
            org.opencontainers.image.version=${{ steps.addon.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
