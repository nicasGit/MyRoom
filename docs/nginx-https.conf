# Exemple à adapter sur le proxy frontal, hors conteneur HAOS.
server {
    listen 443 ssl;
    server_name myroom.example.com;
    ssl_certificate /etc/letsencrypt/live/myroom.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myroom.example.com/privkey.pem;
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    location / {
        proxy_pass http://192.168.1.10:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /ws {
        proxy_pass http://192.168.1.10:8099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
