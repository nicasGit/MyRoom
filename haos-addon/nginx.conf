server {
    listen 8080;
    server_name _;
    root /var/www/myroom;
    index index.html;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Permissions-Policy "xr-spatial-tracking=(self)" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /health { proxy_pass http://127.0.0.1:3000; }
    location = /api/admin/models/import {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /api/admin/models/inspect {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location /api/library/ { proxy_pass http://127.0.0.1:3000; }
    location /api/covers/ { proxy_pass http://127.0.0.1:3000; }
    location = /api/covers { proxy_pass http://127.0.0.1:3000; }
    location = /api/admin/covers/import {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location /api/admin/ {
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
    location = /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
