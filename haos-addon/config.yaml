name: MyRoom
version: "0.10.3"
slug: myroom
url: https://github.com/nicasgit/myroom
image: ghcr.io/nicasgit/myroom
description: Prototype WebXR multijoueur pour une pièce partagée
arch:
  - aarch64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8080]/"
ports:
  8080/tcp: 8099
ports_description:
  8080/tcp: HTTP interne à placer derrière un proxy HTTPS
options:
  public_origin: "https://myroom.example.com"
  admin_token: ""
schema:
  public_origin: url
  admin_token: password
  debug_without_admin_token: bool?
